<svg xmlns="http://www.w3.org/2000/svg" width="960" height="512" viewBox="0 0 960 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">LLM evaluation and document automation</title>
  <desc id="desc">Concept diagram with two areas: structured evaluation of model responses, and document drafts moving through human review to delivery.</desc>
  <rect width="960" height="512" fill="#f0f4ec"/>
  <rect x="32" y="32" width="896" height="448" rx="20" fill="#ffffff" stroke="#dbe4d8"/>
  <g transform="translate(0 -128)" font-family="Avenir Next, Avenir, Segoe UI, Arial, sans-serif" font-weight="400">

    <rect x="64" y="185" width="302" height="333" rx="12" fill="#f7f8f4" stroke="#dbe4d8"/>
    <text x="84" y="225" fill="#263c30" font-size="23" font-weight="500">Response evaluation</text>
    <text x="84" y="255" fill="#5b6d60" font-size="17">Structured testing &amp; review</text>
    <rect x="84" y="278" width="262" height="167" rx="8" fill="#ffffff" stroke="#dbe4d8"/>
    <path d="M84 333H346M84 389H346" stroke="#dbe4d8"/>
    <g stroke="#326449" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <rect x="104" y="296" width="18" height="18" rx="3"/>
      <path d="M109 302H117M109 308H114"/>
      <path d="M104 352H122V365H113L107 370V365H104Z"/>
      <circle cx="113" cy="417" r="10"/>
      <path d="m108 417 4 4 7-8"/>
    </g>
    <text x="139" y="313" fill="#263c30" font-size="20">Test cases</text>
    <text x="139" y="369" fill="#263c30" font-size="20">Model responses</text>
    <text x="139" y="425" fill="#263c30" font-size="20">Accuracy review</text>
    <path d="M102 473H311M102 487H280" stroke="#dbe4d8" stroke-width="5" stroke-linecap="round"/>

    <rect x="392" y="185" width="504" height="333" rx="12" fill="#ffffff" stroke="#9fb6a2"/>
    <text x="416" y="225" fill="#263c30" font-size="23" font-weight="500">Document workflow</text>
    <text x="416" y="255" fill="#5b6d60" font-size="17">From generated draft to reviewed output</text>

    <path d="M537 375H570M563 368L570 375L563 382M718 375H751M744 368L751 375L744 382" stroke="#326449" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="416" y="297" width="114" height="153" rx="8" fill="#f7f8f4" stroke="#dbe4d8"/>
    <rect x="440" y="317" width="52" height="63" rx="5" fill="#ffffff" stroke="#9fb6a2"/>
    <path d="M452 334H480M452 345H480M452 356H472" stroke="#9fb6a2" stroke-width="3" stroke-linecap="round"/>
    <text x="473" y="416" fill="#263c30" font-size="20" text-anchor="middle">Draft</text>

    <rect x="578" y="285" width="132" height="177" rx="8" fill="#e7efe5" stroke="#9fb6a2"/>
    <circle cx="644" cy="329" r="19" fill="#ffffff"/>
    <g stroke="#326449" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="644" cy="323" r="5"/>
      <path d="M633 337C633 326 655 326 655 337"/>
    </g>
    <text x="644" y="381" fill="#244c36" font-size="21" font-weight="500" text-anchor="middle">Human</text>
    <text x="644" y="408" fill="#244c36" font-size="21" font-weight="500" text-anchor="middle">review</text>
    <path d="M608 434H680" stroke="#9fb6a2" stroke-width="3" stroke-linecap="round"/>

    <rect x="758" y="297" width="114" height="153" rx="8" fill="#f7f8f4" stroke="#dbe4d8"/>
    <rect x="789" y="317" width="52" height="63" rx="5" fill="#ffffff" stroke="#9fb6a2"/>
    <path d="m805 337 7 7 13-15M801 359H829M801 368H820" stroke="#326449" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="815" y="416" fill="#263c30" font-size="20" text-anchor="middle">Delivery</text>
    <text x="416" y="495" fill="#326449" font-size="16">Approval before delivery</text>

    <path d="M64 548H896" stroke="#dbe4d8"/>
    <circle cx="69" cy="576" r="4" fill="#326449"/>
    <text x="84" y="582" fill="#5b6d60" font-size="18">Evaluate responses</text>
    <circle cx="385" cy="576" r="4" fill="#326449"/>
    <text x="400" y="582" fill="#5b6d60" font-size="18">Review documents</text>
    <circle cx="693" cy="576" r="4" fill="#326449"/>
